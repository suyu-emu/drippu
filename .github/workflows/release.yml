name: Release v0.04 latest

on:
  schedule:
    - cron: '0 0 1 * *'
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        shell: bash
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          arch: win64_msvc2019_64
          modules: qtcharts qtmultimedia qtwebengine
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdkDir = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
      - name: Configure
        shell: bash
        run: |
          cmake --version
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -GNinja 2>&1 | tee cmake_configure.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-windows
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu suyu-cmd -j4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _pkg
          Copy-Item build/bin/suyu.exe _pkg/drippu.exe
          Copy-Item build/bin/suyu-cmd.exe _pkg/drippu-cmd.exe
          windeployqt --release --no-translations _pkg/drippu.exe
          Compress-Archive -Path _pkg/* -DestinationPath drippu-windows-x64.zip
      - name: Verify packaged Windows application and dependencies
        shell: pwsh
        run: python .github/scripts/verify_release_artifacts.py desktop --platform windows --archive drippu-windows-x64.zip
      - name: Record toolchain
        shell: bash
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            drippu-windows-x64.zip
            toolchain.txt

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools \
            qt6-base-dev qt6-base-private-dev \
            qt6-multimedia-dev qt6-tools-dev qt6-svg-dev qt6-webengine-dev \
            qt6-charts-dev \
            libssl-dev libusb-1.0-0-dev libpulse-dev \
            libvulkan-dev gamemode-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev libwayland-egl1 wayland-protocols libdecor-0-dev \
            libegl-dev libdrm-dev libgbm-dev \
            libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev \
            libboost-all-dev
      - name: Configure
        run: |
          cmake --version
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -GNinja -DOPENSSL_ROOT_DIR=/usr 2>&1 | tee cmake_configure.log
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-linux
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu suyu-cmd -j4
      - name: Package
        run: |
          rm -rf _pkg && mkdir _pkg
          cp build/bin/suyu _pkg/drippu
          cp build/bin/suyu-cmd _pkg/drippu-cmd 2>/dev/null || true
          tar -czf drippu-linux-x64.tar.gz -C _pkg .
      - name: Verify packaged Linux application and dependencies
        run: python3 .github/scripts/verify_release_artifacts.py desktop --platform linux --archive drippu-linux-x64.tar.gz
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            drippu-linux-x64.tar.gz
            toolchain.txt

  build-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - name: Install deps
        run: brew install ninja qt@6 openssl ffmpeg glslang molten-vk boost
      - name: Configure
        run: |
          cmake --version
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -GNinja \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix openssl);$(brew --prefix ffmpeg)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DYUZU_USE_BUNDLED_MOLTENVK=OFF 2>&1 | tee cmake_configure.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-macos
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu suyu-cmd -j4
      - name: Package
        run: |
          rm -rf _pkg && mkdir _pkg
          cp -r build/bin/suyu.app _pkg/drippu.app 2>/dev/null || cp build/bin/suyu _pkg/drippu
          cp build/bin/suyu-cmd _pkg/drippu-cmd 2>/dev/null || true
          tar -czf drippu-macos-arm64.tar.gz -C _pkg .
      - name: Verify packaged macOS application and dependencies
        run: python3 .github/scripts/verify_release_artifacts.py desktop --platform macos --archive drippu-macos-arm64.tar.gz
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            drippu-macos-arm64.tar.gz
            toolchain.txt

  build-freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja qt6-base qt6-multimedia openssl pulseaudio vulkan-headers pkgconf libX11 libXext libXrandr wayland wayland-protocols libdecor mesa-libs evdev-proto glslang ffmpeg boost-all
          run: |
            f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
            if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
              printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
            fi
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -GNinja
            cmake --build build --target suyu suyu-cmd -j4
            rm -rf _pkg && mkdir _pkg
            cp build/bin/suyu _pkg/drippu
            cp build/bin/suyu-cmd _pkg/drippu-cmd 2>/dev/null || true
            tar -czf drippu-freebsd-x64.tar.gz -C _pkg .
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: |
            drippu-freebsd-x64.tar.gz
            toolchain.txt

  build-android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools
      - name: Build APKs
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleLegacyRelease assembleMainlineRelease assembleChromeOSRelease assembleGenshinSpoofRelease --stacktrace
      - name: Collect APKs
        run: |
          rm -rf _pkg && mkdir _pkg
          find src/android -name '*.apk' -exec cp {} _pkg/ \;
      - name: Verify packaged Android APKs
        run: |
          for apk in _pkg/*.apk; do
            python3 .github/scripts/verify_release_artifacts.py apk --platform android --archive "$apk"
          done
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            _pkg/*.apk
            toolchain.txt

  build-libretro:
    name: Libretro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools \
            libssl-dev libusb-1.0-0-dev libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev libwayland-egl1 wayland-protocols libdecor-0-dev \
            libegl-dev libdrm-dev libgbm-dev libpulse-dev \
            libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev \
            libboost-all-dev
      - name: Configure
        run: |
          cmake --version
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSUYU_BUILD_LIBRETRO_CORE=ON -DENABLE_QT=OFF -GNinja 2>&1 | tee cmake_configure.log
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-libretro
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu_libretro -j4
      - name: Package
        run: |
          rm -rf _pkg && mkdir _pkg
          find build -name 'suyu_libretro.so' -exec cp {} _pkg/ \;
          tar -czf drippu-libretro-core-linux-x64.tar.gz -C _pkg .
      - name: Verify packaged Linux libretro core and API
        run: python3 .github/scripts/verify_release_artifacts.py libretro --platform linux --archive drippu-libretro-core-linux-x64.tar.gz
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libretro
          path: |
            drippu-libretro-core-linux-x64.tar.gz
            toolchain.txt

  build-libretro-windows:
    name: Libretro Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        shell: bash
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdkDir = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
      - name: Configure
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSUYU_BUILD_LIBRETRO_CORE=ON -DENABLE_QT=OFF -GNinja 2>&1 | tee cmake_configure.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-libretro-windows
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu_libretro -j4
      - name: Package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force _pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory _pkg | Out-Null
          Get-ChildItem build -Recurse -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName _pkg/ -Force }
          Compress-Archive -Path _pkg/* -DestinationPath drippu-libretro-core-windows-x64.zip
      - name: Verify packaged Windows libretro core and API
        shell: pwsh
        run: python .github/scripts/verify_release_artifacts.py libretro --platform windows --archive drippu-libretro-core-windows-x64.zip
      - name: Record toolchain
        shell: bash
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libretro-windows
          path: |
            drippu-libretro-core-windows-x64.zip
            toolchain.txt

  build-libretro-android:
    name: Libretro Android
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          set -o pipefail
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUYU_BUILD_LIBRETRO_CORE=ON -DENABLE_QT=OFF -GNinja 2>&1 | tee cmake_configure.log
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-libretro-android
          path: cmake_configure.log
      - name: Build
        run: cmake --build build --target suyu_libretro -j4
      - name: Package
        run: |
          rm -rf _pkg && mkdir _pkg
          find build -name '*suyu_libretro*.so' -exec cp {} _pkg/suyu_libretro_android_arm64-v8a.so \;
          tar -czf drippu-libretro-core-android-arm64.tar.gz -C _pkg .
      - name: Verify packaged Android libretro core archive
        run: |
          test "$(tar -tzf drippu-libretro-core-android-arm64.tar.gz | grep -c '\.so$')" -ge 1
      - name: Record toolchain
        run: bash .github/scripts/write_toolchain.sh toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libretro-android
          path: |
            drippu-libretro-core-android-arm64.tar.gz
            toolchain.txt

  exporter-smoke:
    uses: ./.github/workflows/exporter-smoke.yml

  tests:
    uses: ./.github/workflows/tests.yml

  verify-release-artifacts:
    name: Verify release artifact structure
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-android.result == 'success' && needs.build-libretro.result == 'success' && needs.build-libretro-windows.result == 'success' && needs.exporter-smoke.result == 'success' && needs.tests.result == 'success' }}
    needs: [build-windows, build-linux, build-macos, build-freebsd, build-android, build-libretro, build-libretro-windows, build-libretro-android, exporter-smoke, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install release-gate dependencies
        run: |
          python3 -m venv .release-gate-venv
          .release-gate-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - name: Test artifact verifier
        run: .release-gate-venv/bin/python .github/scripts/test_verify_release_artifacts.py
      - name: Check every archive has the expected package structure
        run: |
          set -euo pipefail
          mapfile -t archives < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) | sort)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            .release-gate-venv/bin/python .github/scripts/verify_release_artifacts.py structure --platform generic --archive "$archive"
          done
      - name: Run release-gate regression
        run: .release-gate-venv/bin/python .github/scripts/check_release_gate.py

  release:
    name: Publish Release
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-android.result == 'success' && needs.build-libretro.result == 'success' && needs.build-libretro-windows.result == 'success' && needs.exporter-smoke.result == 'success' && needs.tests.result == 'success' && needs.verify-release-artifacts.result == 'success' }}
    needs: [build-windows, build-linux, build-macos, build-freebsd, build-android, build-libretro, build-libretro-windows, build-libretro-android, exporter-smoke, tests, verify-release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f || echo "No artifacts found"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_release.sh
