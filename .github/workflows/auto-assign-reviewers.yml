name: Auto Assign Reviewers

# Auto-requests review from SourCreamCulture + backend-developers team,
# and assigns SourCreamCulture on every PR.
#
# Notes:
# - Teams can be requested as *reviewers* but cannot be added as *assignees*
#   via the API, so assignees is the user account only.
# - pull_request_target is used (instead of pull_request) so this still has
#   write permission on fork PRs without checking out untrusted code.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write # request reviewers
  issues: write # add assignees (PRs are issues under the hood)

jobs:
  auto-assign:
    name: Request backend reviewers
    runs-on: ubuntu-latest
    steps:
      - name: Assign reviewers and assignees
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            const userReviewer = 'SourCreamCulture';
            const teamSlug = 'backend-developers'; // suyu-emu/backend-developers
            const assignee = 'SourCreamCulture';

            // GitHub rejects requesting the PR author as their own reviewer,
            // so skip the user reviewer in that case (team request still goes out).
            const reviewers =
              author.toLowerCase() === userReviewer.toLowerCase() ? [] : [userReviewer];

            // Avoid duplicate requests when the workflow re-runs.
            let existingUsers = [];
            let existingTeams = [];
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              existingUsers = (pr.requested_reviewers || []).map((u) => u.login.toLowerCase());
              existingTeams = (pr.requested_teams || []).map((t) => t.slug.toLowerCase());
            } catch (error) {
              core.warning(`Could not list existing reviewers: ${error.message}`);
            }

            const wantedReviewers = reviewers.filter(
              (r) => !existingUsers.includes(r.toLowerCase()),
            );
            const wantedTeams = existingTeams.includes(teamSlug.toLowerCase()) ? [] : [teamSlug];

            if (wantedReviewers.length > 0 || wantedTeams.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: prNumber,
                  reviewers: wantedReviewers,
                  team_reviewers: wantedTeams,
                });
                core.info(
                  `Requested reviewers: users=[${wantedReviewers}] teams=[${wantedTeams}]`,
                );
              } catch (error) {
                // Common causes: reviewer is not a collaborator, or the team
                // has no access to this repo. Warn instead of failing the PR.
                core.warning(`Could not request reviewers: ${error.message}`);
              }
            } else {
              core.info('Reviewers already requested, nothing to do.');
            }

            // Assignees only accept users, not teams.
            const currentAssignees = (context.payload.pull_request.assignees || []).map((u) =>
              u.login.toLowerCase(),
            );
            if (!currentAssignees.includes(assignee.toLowerCase())) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: prNumber,
                  assignees: [assignee],
                });
                core.info(`Assigned: ${assignee}`);
              } catch (error) {
                core.warning(`Could not add assignee: ${error.message}`);
              }
            } else {
              core.info(`Assignee ${assignee} already set.`);
            }
