name: Exporter smoke

# Portable acceptance check for the active AArch64 exporter: EmitProject
# compile plus RET/BLR probes, and the headless homebrew runtime harness.
# Uses src/tests/recompiler and arm64_to_c.h.
# Does not build the emulator or run tools/static_recompiler.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  exporter-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src/tests/recompiler -B build-exporter-smoke
      - name: Build
        run: cmake --build build-exporter-smoke --config Release
      - name: Test
        run: ctest --test-dir build-exporter-smoke --build-config Release --output-on-failure
