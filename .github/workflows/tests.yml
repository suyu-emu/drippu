name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1
      - name: Fix submodule headers
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools \
            libssl-dev libusb-1.0-0-dev libpulse-dev \
            libvulkan-dev gamemode-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev libwayland-egl1 wayland-protocols libdecor-0-dev \
            libegl-dev libdrm-dev libgbm-dev \
            libavcodec-dev libavfilter-dev libavutil-dev libswscale-dev \
            libboost-all-dev
      - name: Configure
        run: |
          cmake --version
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=OFF -DYUZU_TESTS=ON -DYUZU_CMD=OFF -GNinja -DOPENSSL_ROOT_DIR=/usr 2>&1 | tee cmake_configure.log
      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-tests
          path: cmake_configure.log
      - name: Build tests
        run: cmake --build build --target tests recomp_stack_harness -j4
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -R '^(tests|recomp_stack_harness)$'
